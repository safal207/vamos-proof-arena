const $=id=>document.getElementById(id),view=$('view'),cash=n=>'$'+(n/100).toFixed(2), btn=(id,t,c='')=>`<button id="${id}" class="${c}">${t}</button>`;

['Game wallet','Игровой кошелёк','游戏钱包'],['Coins','Монеты','金币'],['Level','Уровень','等级'],['Earned coins','Заработано монет','已赚金币'],['Cosmetics only. No cash value, purchases or API credit.','Только косметика. Не реальные деньги, покупки или API-кредит.','仅限装饰。无现金价值、付费购买或 API 额度。'],['100 XP and 25 coins per completed mission; 50 XP and 20 coins for the optimal route, once.','100 XP и 25 монет за миссию; 50 XP и 20 монет за оптимальный маршрут, один раз.','每完成一项任务获得 100 XP 和 25 金币；最优路线一次性奖励 50 XP 和 20 金币。'],['First-pass bonus: 5 coins per mission without errors.','Бонус за чистое прохождение: 5 монет за миссию без ошибок.','无错通关奖励：每项任务 5 金币。'],['Next level','Следующий уровень','下一级'],['Solar aura','Солнечная аура','太阳光环'],['Ocean aura','Океанская аура','海洋光环'],['Buy for 60 coins','Купить за 60 монет','60 金币购买'],['Buy for 90 coins','Купить за 90 монет','90 金币购买'],['Equip','Надеть','装备'],['Equipped','Надето','已装备'],['Default look','Обычный вид','默认外观'],['Club','Клуб','俱乐部'],['Local club preview','Локальный прототип клуба','本地俱乐部预览'],['Only on this device in this session. No online members or public posts.','Только на этом устройстве в текущей сессии. Нет онлайн-участников и публичных постов.','仅在此设备的当前会话中使用。没有在线成员或公开帖子。'],['Publish my achievement locally','Добавить своё достижение в ленту','将我的成就添加到本地动态'],['Your achievement','Ваше достижение','你的成就'],['Complete a mission to share an achievement.','Завершите миссию, чтобы поделиться достижением.','完成任务后即可分享成就。'],['Already shared at this milestone.','Это достижение уже добавлено.','该成就已分享。'],['Achievement added locally.','Достижение добавлено локально.','成就已添加到本地。'],['No local posts yet.','Пока нет локальных постов.','暂无本地动态。'],['Copy challenge to a friend','Копировать вызов для друга','复制挑战给好友'],['Challenge copied.','Задача скопирована.','任务已复制。'],['Music off','Музыка выкл.','音乐关闭'],['Music on','Музыка вкл.','音乐开启'],['Music volume','Громкость музыки','音乐音量'],['Back to game','Назад в игру','返回游戏'],['Clear local posts','Очистить локальную ленту','清空本地动态'],['Not enough coins.','Недостаточно монет.','金币不足。'],['Cosmetic unlocked.','Образ открыт.','装饰已解锁。'],['Your progress resets when you restart.','При перезапуске прогресс сбрасывается.','重新开始时进度会重置。']];
for(const [en,ru,zh] of playLabels)translations[en]={ru,zh};
const playState=()=>s.play||(s.play={owned:[],equipped:'default',posts:[]});
function economy(){const p=playState(),clean=s.proofs.filter((_,i)=>!s.events.some(e=>e.name==='action'&&e.mission===i+1&&!e.correct)).length;const xp=s.proofs.length*100+(s.bonus?50:0),earned=s.proofs.length*25+clean*5+(s.bonus?20:0),spent=p.owned.reduce((a,k)=>a+({solar:60,ocean:90}[k]||0),0);return {xp,earned,spent,coins:earned-spent,level:1+Math.floor(xp/150),next:150-xp%150};}
const cosmeticPrices={solar:60,ocean:90};
function buyCosmetic(k){const p=playState();if(!Object.hasOwn(cosmeticPrices,k)||p.owned.includes(k)||economy().coins<cosmeticPrices[k])return false;p.owned.push(k);p.equipped=k;log('cosmetic_unlocked',{cosmetic:k});tone(true);return true;}
let playReturn='intro';
function openPlay(t){if(!['wallet','club'].includes(tab))playReturn=tab;show(t)}
function walletView(){const e=economy(),p=playState();view.innerHTML=head()+'<h2>Game wallet</h2>'+hero('mini')+'<div class="score"><div><small>Coins</small><b>🪙 '+e.coins+'</b></div><div><small>Level</small><b>'+e.level+'</b></div></div><div class="row"><b>XP</b><span>'+e.xp+'</span></div><div class="budgetbar"><span style="width:'+((e.xp%150)/150*100)+'%"></span></div><div class="row"><small>Next level</small><b>'+e.next+' XP</b></div><p>100 XP and 25 coins per completed mission; 50 XP and 20 coins for the optimal route, once.</p><p>First-pass bonus: 5 coins per mission without errors.</p><small>Cosmetics only. No cash value, purchases or API credit.</small>'+['solar','ocean'].map(k=>'<div class="tile"><b>'+({solar:'Solar aura',ocean:'Ocean aura'}[k])+'</b><button data-cosmetic="'+k+'" '+(p.equipped===k?'disabled':'')+'>'+(p.equipped===k?'Equipped':p.owned.includes(k)?'Equip':k==='solar'?'Buy for 60 coins':'Buy for 90 coins')+'</button></div>').join('')+btn('defaultLook','Default look')+'<div id="feedback" role="status"></div>'+btn('playBack','Back to game')+'<small>Your progress resets when you restart.</small>';const stamp=epoch;view.querySelectorAll('[data-cosmetic]').forEach(b=>b.onclick=()=>{if(stamp!==epoch)return;const k=b.dataset.cosmetic;if(p.owned.includes(k)){p.equipped=k;render();return}if(buyCosmetic(k)){render();$('feedback').textContent='Cosmetic unlocked.'}else $('feedback').textContent='Not enough coins.'});bind('defaultLook',()=>{p.equipped='default';render()});bind('playBack',()=>show(playReturn));}
function clubView(){const p=playState();view.innerHTML=head()+'<h2>Club</h2><p>Local club preview</p><small>Only on this device in this session. No online members or public posts.</small>'+btn('publishLocal','Publish my achievement locally','gold')+btn('copyFriend','Copy challenge to a friend')+'<textarea id="friendChallenge" readonly aria-label="Challenge prompt"></textarea><div id="feedback" role="status"></div>'+(p.posts.length?p.posts.map(post=>'<div class="proof"><b>Your achievement</b><span>'+post.proofs+'/6 · '+post.xp+' XP · 🪙 '+post.coins+'</span></div>').join(''):'<p>No local posts yet.</p>')+btn('clearPosts','Clear local posts')+btn('playBack','Back to game');$('friendChallenge').value='VAMOS: https://safal207.github.io/vamos-proof-arena/\n'+promptText;bind('publishLocal',()=>{if(!s.proofs.length){$('feedback').textContent='Complete a mission to share an achievement.';return}const key=s.proofs.length+':'+Number(s.bonus);if(p.posts.some(x=>x.key===key)){$('feedback').textContent='Already shared at this milestone.';return}const e=economy();p.posts.unshift({key,proofs:s.proofs.length,xp:e.xp,coins:e.coins});render();$('feedback').textContent='Achievement added locally.'});bind('copyFriend',async()=>{const el=$('friendChallenge'),stamp=epoch;try{await navigator.clipboard.writeText(el.value);if(stamp===epoch)$('feedback').textContent='Challenge copied.'}catch{if(stamp===epoch){el.select();$('feedback').textContent='Select and copy the challenge manually.'}}});bind('clearPosts',()=>{p.posts=[];render()});bind('playBack',()=>show(playReturn));}
const playView=renderView;renderView=function(){if(tab==='wallet')walletView();else if(tab==='club')clubView();else playView();const p=playState(),art=view.querySelector('.hero');if(art){if(s.hero&&s.hero!=='fox')art.innerHTML=animal(s.hero);art.dataset.aura=p.equipped;}if(tab==='proof'||tab==='victory'){const e=economy();view.insertAdjacentHTML('beforeend','<div class="play-reward"><b>🪙 '+e.coins+'</b><b>'+e.xp+' XP</b><b><span>Level</span> '+e.level+'</b></div>');}};
const playReport=report;report=function(){return {...playReport(),version:'VALTA-039',gameEconomy:{...economy(),scope:'virtual cosmetics only',owned:playState().owned.slice()}}};
const hudPlay=document.createElement('div');hudPlay.className='play-hud';hudPlay.innerHTML='<button id="walletNav">🪙 <span>Game wallet</span></button><button id="clubNav">💬 <span>Club</span></button><button id="musicToggle" aria-pressed="false">Music off</button><label for="musicVolume"><span>Music volume</span><input id="musicVolume" type="range" min="0" max="100" value="35"></label>';document.querySelector('header').after(hudPlay);$('walletNav').onclick=()=>openPlay('wallet');$('clubNav').onclick=()=>openPlay('club');
// Original short arcade score. Audio begins only by explicit opt-in; hidden tabs pause it.
const scoreNotes=[72,76,79,76,74,77,81,77,71,74,79,74,72,76,79,84,69,72,76,72,67,71,74,71,65,69,72,69,67,71,74,76];
let music=false,musicTimer=null,musicBeat=0,musicBus=null;
function musicStop(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}if(musicBus&&ac){musicBus.gain.cancelScheduledValues(ac.currentTime);musicBus.gain.setValueAtTime(0,ac.currentTime);musicBus.disconnect();musicBus=null}}
function musicTick(){if(!music||document.hidden||!musicBus||!ac)return;const t=ac.currentTime,beat=musicBeat++,note=scoreNotes[beat%scoreNotes.length];for(const [n,gain,dur] of [[note,.09,.19],...(beat%4===0?[[note-24,.12,.43]]:[])]){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(gain,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(musicBus);o.start(t);o.stop(t+dur+.02)}}
function musicStart(){if(!music||document.hidden||musicTimer!==null)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{});musicBus=ac.createGain();musicBus.gain.value=Number($('musicVolume').value)/100;musicBus.connect(ac.destination);musicTick();musicTimer=setInterval(musicTick,250)}catch{music=false;musicStop();musicUI()}}
function musicUI(){$('musicToggle').textContent=music?'Music on':'Music off';$('musicToggle').setAttribute('aria-pressed',String(music));}
$('musicToggle').onclick=()=>{music=!music;if(music)musicStart();else musicStop();musicUI()};$('musicVolume').oninput=()=>{if(musicBus&&ac)musicBus.gain.setTargetAtTime(Number($('musicVolume').value)/100,ac.currentTime,.03)};document.addEventListener('visibilitychange',()=>document.hidden?musicStop():musicStart());window.addEventListener('pagehide',musicStop);

bind('sound',()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(true)});bind('vault',()=>show('vault'));bind('reset',()=>{s=fresh();show('intro')});render();
</script></body></html>
