<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAMOS · Guardian Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff2dc;color:#502719;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:16px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}header{font-weight:950;font-size:23px}small,p{color:#805844}h1,h2,p{margin:0}h1{font-size:37px;line-height:1.02;letter-spacing:-1.5px}section{margin:16px 0;padding:16px;background:#fffaf0;border:2px solid #502719;border-radius:24px;display:grid;gap:14px}.hero{background:radial-gradient(#fff6b1,#ffc74e);border:2px solid #502719;border-radius:20px;text-align:center}.hero svg{width:100%;height:150px}button{font:800 15px system-ui;color:#502719;background:linear-gradient(#fffdf5,#f7e1bc);border:2px solid #502719;border-radius:14px;min-height:48px;padding:10px;box-shadow:0 4px #502719;cursor:pointer}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px #502719}button:focus-visible{outline:3px solid #6742ab;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{background:linear-gradient(#e54a2c,#b82b19);color:white;font-size:19px}.gold{background:#ffd45f}.proof{background:#e6f3bd;border:2px solid #6a8c3b;padding:12px;border-radius:14px;overflow-wrap:anywhere}.meter{display:flex;gap:5px}.meter i{flex:1;height:9px;background:#e6d5bd;border-radius:9px}.meter .done{background:#75a848}.meter .active{background:#f9b72a}.choices{display:grid;gap:10px}.choices button{text-align:left}.muted{font-size:12px}footer{text-align:center;font-size:11px;color:#805844}.accent{color:#b82b19}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header>VAMOS! <button id="sound" aria-pressed="false">Sound off</button></header><section id="view" aria-live="polite"></section><div class="row"><button id="vault">My Proofs</button><button id="reset">Free restart</button></div><footer>VALTA-030 · INDEPENDENT LOCAL SIMULATION · NO REAL API OR MONEY</footer></main><script>
'use strict';
const fixtures=[[{"status":"CAP_DENIED","dispatched":false,"settled":0,"reserved":0,"id":1,"amount":1000}],[{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":100,"id":1,"amount":100},{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":200,"id":2,"amount":100},{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":300,"id":3,"amount":100},{"status":"CAP_DENIED","dispatched":false,"settled":0,"reserved":300,"id":4,"amount":100}],[{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":100,"id":1,"amount":100},{"status":"FROZEN_NOW","dispatched":false,"settled":0,"reserved":100,"id":0,"amount":0},{"status":"FROZEN","dispatched":false,"settled":0,"reserved":100,"id":2,"amount":100}],[{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":200,"id":1,"amount":200},{"status":"UNCERTAIN","dispatched":false,"settled":0,"reserved":200,"id":1,"amount":0}],[{"status":"RATE_DENIED","dispatched":false,"settled":0,"reserved":0,"id":1,"amount":100}],[{"status":"ALLOWED","dispatched":true,"settled":0,"reserved":100,"id":1,"amount":100},{"status":"SETTLED","dispatched":false,"settled":80,"reserved":0,"id":1,"amount":80}]];
const missions=[
['First Deny','Protection Proof','Your agent wants $10. The run cap is $3. What happens?','CAP_DENIED','ALLOWED','RATE_DENIED','The cap rejects the request before dispatch.'],
['Stop the Loop','Budget Proof','Three $1 requests already hold the $3 budget. Predict the fourth request.','CAP_DENIED','ALLOWED','SETTLED','Reservations count against the cap.'],
['Freeze','Guardian Proof','A $1 request is pending. Freeze the agent and inspect the next request.','FROZEN','ALLOWED','RELEASED','Freeze stops new requests, not existing reservations.'],
['Unknown Signal','Recovery Proof','A $2 request times out. Pick the safe interpretation.','UNCERTAIN','RELEASED','SETTLED','Unknown does not mean free. The $2 reservation remains.'],
['Error Detective','Diagnostic Proof','The local rate gate refuses a request before provider dispatch. Identify the reason.','RATE_DENIED','CAP_DENIED','ALLOWED','A local rate denial is not an upstream response.'],
['Find the Proof','Audit Proof','A $1 reservation settles at $0.80. Which receipt is consistent?','SETTLED','UNCERTAIN','RELEASED','The reserved amount is released and $0.80 is settled.']];
const $=id=>document.getElementById(id), view=$('view');
const fresh=()=>({credits:15,mission:0,proofs:[],attempts:0,secret:false});let s=fresh(),sound=false,ac,tab='intro';
const cash=n=>'$'+(n/100).toFixed(2);const end=i=>fixtures[i].at(-1);
const hero='<div class="hero"><svg viewBox="0 0 250 160" role="img" aria-label="Vee, a rounded orange fox companion"><ellipse cx="125" cy="148" rx="65" ry="7" fill="#d69c39"/><path d="M165 129Q231 144 225 75Q254 132 211 146Q180 156 165 129" fill="#e88a31" stroke="#9e461d" stroke-width="3"/><ellipse cx="125" cy="119" rx="43" ry="31" fill="#eb8b32"/><ellipse cx="125" cy="124" rx="25" ry="21" fill="#fff2d6"/><path d="M72 63Q42 3 91 31L112 55M178 63Q208 3 159 31L138 55" fill="#ef9d41" stroke="#9e461d" stroke-width="4"/><ellipse cx="125" cy="75" rx="69" ry="49" fill="#f7a94d" stroke="#a64b1c" stroke-width="3"/><path d="M58 78Q76 48 125 72Q174 48 192 78Q190 122 125 124Q60 122 58 78" fill="#fff1d4"/><ellipse cx="96" cy="77" rx="15" ry="20" fill="#502719"/><ellipse cx="154" cy="77" rx="15" ry="20" fill="#502719"/><circle cx="101" cy="70" r="6" fill="white"/><circle cx="159" cy="70" r="6" fill="white"/><path d="M117 96Q125 91 133 96Q125 107 117 96M119 107Q125 116 131 107" stroke="#502719" fill="#502719" stroke-linecap="round"/><path d="M117 124l6 7 12-13" fill="none" stroke="#a64b1c" stroke-width="5" stroke-linecap="round"/></svg></div>';
function tone(){if(!sound)return;try{ac=ac||new AudioContext();ac.resume().catch(()=>{});[440,660,880].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.08;o.frequency.value=f;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.13)})}catch{}}
function head(){return '<div class="row"><small>SEASON 01 · PROTECT YOUR AGENT</small><b>'+s.credits+' credits</b></div><div class="meter">'+missions.map((_,i)=>'<i class="'+(i<s.mission?'done':i===s.mission?'active':'')+'"></i>').join('')+'</div>'}
function button(id,text,cls=''){return '<button id="'+id+'" class="'+cls+'">'+text+'</button>'}
function bind(id,fn){$(id).onclick=fn}
function receipt(r){return '<b>'+r.status+'</b><p>Request #'+r.id+' · event dispatched: '+r.dispatched+'<br>Settled '+cash(r.settled)+' · reserved '+cash(r.reserved)+'</p>'}
function render(){
 if(tab==='intro'){view.innerHTML='<small class="accent">VAMOS · FINANCIAL GUARDIAN</small><h1>What can your AI agent do?</h1><h2 class="accent">Don’t tell us. Prove it.</h2>'+hero+'<p>Play it yourself. Then challenge your agent.</p>'+button('start','VAMOS!','primary')+'<small>15 free virtual practice credits.</small>';bind('start',()=>{tab='quest';render()});return}
 if(tab==='vault'){view.innerHTML=head()+'<h2>My Proof Collection</h2>'+(s.proofs.map((p,i)=>'<div class="proof"><b>◆ '+missions[i][1]+'</b><p>Local fixture '+(i+1)+'</p>'+receipt(p)+'</div>').join('')||'<p>No proofs yet.</p>')+(s.mission===6?button('archive','Inspect the archive','gold'):'')+(s.secret?'<div class="proof">Hidden Proof · You checked the original evidence.</div>':'')+button('back','Return to quest');if($('archive'))bind('archive',()=>{s.secret=true;tone();render()});bind('back',()=>{tab='quest';render()});return}
 if(tab==='arena'){const bots=[['Careful baseline',missions.map((_,i)=>end(i).status)],['Always allow',missions.map(()=> 'ALLOWED')],['Always deny',missions.map(()=> 'CAP_DENIED')]];const ranks=[['You',s.proofs.length,s.attempts],...bots.map(([n,a])=>[n,a.filter((x,i)=>x===end(i).status).length,6])].sort((a,b)=>b[1]-a[1]||a[2]-b[2]||a[0].localeCompare(b[0]));view.innerHTML=head()+'<h2>Can your agent do better?</h2><p>Local scripted baselines, not live AI.</p>'+ranks.map((r,i)=>'<div class="row"><b>'+(i+1)+'. '+r[0]+'</b><span>'+r[1]+'/6 · '+r[2]+' attempts</span></div>').join('')+button('back','Return to quest');bind('back',()=>{tab='quest';render()});return}
 if(s.mission===6){view.innerHTML=head()+hero+'<h2>All six Proofs found!</h2><p>You have completed the Valta-inspired practice season.</p>'+button('challenge','Challenge an agent','primary')+button('inspect','Inspect your evidence','gold');bind('challenge',()=>{tab='arena';render()});bind('inspect',()=>{tab='vault';render()});return}
 const i=s.mission,m=missions[i],options=[m[3],m[4],m[5]];if(i%3===1)options.push(options.shift());if(i%3===2)options.unshift(options.pop());view.innerHTML=head()+'<small class="accent">MISSION '+(i+1)+'</small><h2>'+m[0]+'</h2>'+hero+'<p>'+m[2]+'</p><div class="choices">'+options.map((a,j)=>'<button data-answer="'+a+'" '+(s.credits===0?'disabled':'')+'>'+a+'</button>').join('')+'</div><div id="feedback" role="status">'+(s.credits===0?'Free restart available.':'One practice credit per answer.')+'</div>';
 view.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(s.credits<=0)return;s.credits--;s.attempts++;if(b.dataset.answer!==end(i).status){render();$('feedback').textContent='Not verified. '+m[6];return}const r=end(i);s.proofs.push(r);s.mission++;tone();view.innerHTML=head()+'<div class="proof"><h2>◆ '+m[1]+'</h2>'+receipt(r)+'</div><p>'+m[6]+'</p>'+button('next',s.mission===6?'Finish season':'Next mission','primary');bind('next',render)});
}
bind('sound',()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone()});bind('vault',()=>{tab='vault';render()});bind('reset',()=>{s=fresh();tab='intro';render()});render();
</script></body></html>
