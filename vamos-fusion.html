 {name:'Freeze the Agent',proof:'Guardian Proof',steps:[{title:'Request #1 · $1.00',desc:'One request is ready for admission.',choices:[['allow','Admit request'],['deny','Deny valid request']],correct:'allow',receipt:0},{title:'An unexpected retry storm!',desc:'Freeze new work without pretending pending requests were cancelled.',choices:[['freeze','Freeze agent'],['erase','Erase pending cost']],correct:'freeze',receipt:1},{title:'A new request arrives.',desc:'The agent is frozen. Stop new dispatch.',choices:[['deny','Block new request'],['allow','Dispatch anyway']],correct:'deny',receipt:2}],lesson:'Freeze blocks new requests. The existing $1 reservation remains.'},
 {name:'Unknown Signal',proof:'Recovery Proof',steps:[{title:'Request #1 · $2.00',desc:'Admit one request within the cap.',choices:[['allow','Reserve $2'],['deny','Deny valid request']],correct:'allow',receipt:0},{title:'No response from the provider.',desc:'A timeout does not establish whether the provider charged you.',choices:[['release','Release all funds'],['hold','Keep reservation; inspect']],correct:'hold',receipt:1}],lesson:'The outcome is uncertain; the reservation stays until trusted resolution.'},
 {name:'Error Detective',proof:'Diagnostic Proof',steps:[{title:'Rate gate refused the request.',desc:'There was no provider dispatch. Classify the event correctly.',choices:[['provider','Upstream provider failure'],['local','Local rate denial']],correct:'local',receipt:0}],lesson:'A local rate denial differs from a provider response.'},

const $=id=>document.getElementById(id),view=$('view'),cash=n=>'$'+(n/100).toFixed(2), btn=(id,t,c='')=>`<button id="${id}" class="${c}">${t}</button>`;
let s,tab='intro',sound=false,ac,epoch=0,dragCleanup=()=>{};const fresh=()=>({credits:15,m:0,step:0,proofs:[],attempts:0,route:['S'],bonus:false,agent:null,events:[],start:Date.now(),first:null});s=fresh();
function log(name,data={}){s.events.push({name,ms:Date.now()-s.start,...data})}
function tone(win){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume().catch(()=>{});(win?[523,659,784]:[392]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.085;o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.12)})}catch{}}
const hero=(cls='')=>`<div class="hero ${cls}">${heroArt}</div>`;const bind=(id,fn)=>{const el=$(id),stamp=epoch;if(el)el.onclick=()=>{if(stamp===epoch||!view.contains(el)&&['sound','vault','reset'].includes(id))fn()}};
function show(t){tab=t;render();window.scrollTo(0,0)}function head(){return `<div class="hud"><span>SEASON 01 · ${s.proofs.length}/6 PROOF</span><span class="pill">${s.credits} credits</span></div><div class="meter" aria-label="${s.proofs.length} of 6 missions complete">${missions.map((_,i)=>`<i class="${i<s.m?'done':i===s.m?'current':''}"></i>`).join('')}</div>`}
function receipt(r){return `<div class="proof"><h3>${r.status}</h3><div>Request #${r.id} · ${r.dispatched?'dispatched':'not dispatched by this event'}</div><div>Settled ${cash(r.settled)} · reserved ${cash(r.reserved)}</div><small>C++ fixture · simulated receipt</small></div>`}
function last(){return s.step?fixtures[s.m][s.step-1]:{settled:0,reserved:0}}function fail(msg){$('feedback').textContent=msg;tone(false)}
function action(code,stamp){if(stamp!==epoch||tab!=='quest')return;if((s.credits===0&&s.step===0)||s.m>=6)return;const m=missions[s.m],step=m.steps[s.step];s.attempts++;log('action',{mission:s.m+1,step:s.step+1,correct:code===step.correct});if(code!==step.correct){if(s.credits>0)s.credits--;render();fail(s.credits===0?'Not verified. Complete this mission if already started, or restart free.':'Not verified. Try the safer action. One practice credit used.');return}if(s.step===0)s.credits--;const r=fixtures[s.m][step.receipt];tone(false);s.step++;if(s.step===m.steps.length){const i=s.m;s.proofs.push({name:m.proof,receipt:r});s.m++;s.step=0;if(s.first===null){s.first=Date.now()-s.start;log('first_proof')}log('proof_earned',{mission:i+1});tone(true);tab='proof';render()}else render()}
function wirePacket(stamp){const packet=$('packet'),targets=[...view.querySelectorAll('[data-action]:not(:disabled)')];if(!packet||!targets.length)return;let active=null;const clear=()=>{active=null;packet.classList.remove('dragging');targets.forEach(b=>b.classList.remove('dropzone','hover'))};const hit=(x,y)=>targets.find(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom});packet.onpointerdown=e=>{if(active!==null||e.button!==0)return;active=e.pointerId;packet.setPointerCapture(active);packet.classList.add('dragging');targets.forEach(b=>b.classList.add('dropzone'))};packet.onpointermove=e=>{if(e.pointerId!==active)return;const b=hit(e.clientX,e.clientY);targets.forEach(t=>t.classList.toggle('hover',t===b))};packet.onpointerup=e=>{if(e.pointerId!==active)return;const b=hit(e.clientX,e.clientY);clear();if(b)action(b.dataset.action,stamp)};packet.onpointercancel=clear;packet.onlostpointercapture=clear;dragCleanup=clear;}
function pathCost(path){if(!Array.isArray(path)||path.length!==4||path[0]!=='S'||path[3]!=='P')return null;let cost=0;for(let i=1;i<path.length;i++){if(typeof path[i]!=='string')return null;const e=(edges[path[i-1]]||[]).find(([n])=>n===path[i]);if(!e)return null;cost+=e[1]}return cost}
function graph(){return `<div class="graph"><svg viewBox="0 0 320 190" role="img" aria-label="Route graph with labelled costs">${Object.entries(edges).flatMap(([a,es])=>es.map(([b,c])=>{const [x,y]=points[a],[u,v]=points[b],yes=s.route.some((n,i)=>n===a&&s.route[i+1]===b);return `<path d="M${x} ${y}L${u} ${v}" stroke="${yes?'#b72c1c':'#bfa17b'}" stroke-width="${yes?5:2}"/><text x="${(x+u)/2}" y="${(y+v)/2-5}" font-size="11" fill="#735044" text-anchor="middle">${c}</text>`})).join('')}${Object.entries(points).map(([k,[x,y]])=>`<circle cx="${x}" cy="${y}" r="${k==='P'?22:17}" fill="${s.route.includes(k)?'#ffcb54':'#fff9ed'}" stroke="#46251c" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="${k==='P'?10:13}" text-anchor="middle" font-weight="800" fill="#46251c">${k==='P'?'Proof':k}</text>`).join('')}</svg></div>`}
const promptText='VAMOS practice challenge. Directed graph with cost per edge: S>A=2, S>B=3, A>C=3, A>D=2, B>D=1, B>E=1, C>P=3, D>P=2, E>P=1. Find a valid minimum-cost path from S to P. Return only JSON {"path":["S","...","...","P"]}. No tools, no API keys, no sensitive context.';

function download(){const b=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='VAMOS-demo-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){dragCleanup();epoch++;renderView()}
function renderView(){
 if(tab==='intro'){view.innerHTML=`<div class="eyebrow">SEASON 01 · THE PROOF HUNT</div><h1>What can your AI agent do?</h1><h2 class="accent">Don't tell us. Prove it.</h2>${hero()}<p>First, save an agent yourself. Then challenge your own AI.</p>${btn('start','VAMOS!','primary')}<small>15 free virtual credits · No signup · First Proof in two taps.</small>`;bind('start',()=>{s.start=Date.now();log('start');show('quest')});return}

 if(tab==='vault'){view.innerHTML=head()+'<h2>My Proof Collection</h2><div class="grid">'+missions.map((m,i)=>`<div class="tile ${s.proofs[i]?'':'locked'}"><div class="seal">${s.proofs[i]?'◆':'◇'}</div><b>${m.proof}</b><small>${s.proofs[i]?s.proofs[i].receipt.status:'Not discovered'}</small></div>`).join('')+'</div>'+(s.bonus?'<div class="proof">◆ Hidden Route Proof · 5 route units</div>':'')+s.proofs.map(p=>receipt(p.receipt)).join('')+btn('export','Export local evidence')+btn('back','Return');bind('export',download);bind('back',()=>show(s.m===6?'victory':s.m||s.events.length?'quest':'intro'));return}
 if(tab==='victory'){view.innerHTML=head()+hero('win')+'<div class="eyebrow">SEASON COMPLETE</div><h1>Guardian victorious!</h1><div class="score"><div><small>Proof collected</small><b>6/6</b></div><div><small>First Proof</small><b>'+Math.max(1,Math.round(s.first/1000))+'s</b></div></div><p>You protected a simulated agent, stopped runaway spending and checked the evidence. Can your own agent do better?</p>'+btn('arena','Challenge your AI','primary')+btn('hidden','Explore the secret route','gold')+btn('export','Export demo evidence')+'<a class="cta" href="https://valta.co/docs" target="_blank" rel="noopener noreferrer">Explore the real Valta docs ↗</a><small>Optional external link. Real integration not connected.</small>';bind('arena',()=>show('arena'));bind('hidden',()=>show('route'));bind('export',download);return}
 if(tab==='route'){const done=s.route.at(-1)==='P',c=pathCost(s.route);view.innerHTML=head()+'<div class="eyebrow">SECRET QUEST · BITOS ROUTE</div><h2>Find the hidden Proof.</h2><p>Choose transitions to reach the vault at the lowest cost. Route units are separate from practice credits.</p>'+graph()+(done?`<div class="proof"><h3>${c===5?'Hidden Proof found!':'Route Proof found!'}</h3><p>${c} route units · ${s.route.join(' → ')}</p></div>`:'<div class="actions">'+edges[s.route.at(-1)].map(([n,k])=>`<button data-edge="${n}">Move to ${n==='P'?'Proof':n} · ${k} units</button>`).join('')+'</div>')+btn('retry','Try another route')+btn('arena','Compare with your AI','primary');const stamp=epoch;view.querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>{if(stamp!==epoch||tab!=='route'||!(edges[s.route.at(-1)]||[]).some(([n])=>n===b.dataset.edge))return;s.route.push(b.dataset.edge);if(s.route.at(-1)==='P'){s.bonus=s.bonus||pathCost(s.route)===5;log('route_completed',{cost:pathCost(s.route)});tone(true)}render()});bind('retry',()=>{s.route=['S'];render()});bind('arena',()=>show('arena'));return}
 if(tab==='arena'){const human=pathCost(s.route);let rows=[['Reference · S–A–C–P',pathCost(['S','A','C','P'])],['Reference · S–A–D–P',pathCost(['S','A','D','P'])]];if(human!==null)rows.push(['You',human]);if(s.agent)rows.push(['Your AI (pasted answer)',s.agent.cost]);rows.sort((a,b)=>a[1]-b[1]||a[0].localeCompare(b[0]));view.innerHTML=head()+`<div class="eyebrow">PROOF ARENA · LOCAL CHALLENGE</div><h2>Can your agent do better?</h2><p>Play the route yourself, copy the same task to any AI, then paste its JSON answer here. No API connection is needed.</p>${btn('route','Play the route yourself','gold')}<textarea id="challenge" readonly aria-label="Challenge prompt">${promptText}</textarea>${btn('copy','Copy agent challenge')}<textarea id="answer" placeholder='{"path":["S","A","D","P"]}' aria-label="Agent answer JSON"></textarea>${btn('verify','Verify agent solution','primary')}<div id="feedback" class="feedback" role="status"></div><div class="rank rankhead"><span>#</span><span>Participant</span><span>Cost</span><span>Proof</span></div>${rows.map((r,i)=>`<div class="rank ${r[0]==='You'?'you':''}"><span>${1+rows.findIndex(x=>x[1]===r[1])}</span><b>${r[0]}</b><span>${r[1]}</span><span>✓</span></div>`).join('')}<small>Two fixed reference routes. Ties share rank. Pasted answers are locally checked, not authenticated agent runs.</small>${btn('back','Back to victory')}`;bind('route',()=>show('route'));bind('copy',async()=>{try{await navigator.clipboard.writeText(promptText);$('feedback').textContent='Challenge copied.'}catch{$('challenge').select();$('feedback').textContent='Select and copy the challenge manually.'}});bind('verify',()=>{try{const raw=$('answer').value;if(raw.length>1024)throw Error();const v=JSON.parse(raw);if(!v||Object.keys(v).length!==1||!Object.hasOwn(v,'path'))throw Error();const cost=pathCost(v.path);if(cost===null)throw Error();s.agent={path:v.path,cost};log('agent_answer_verified',{cost});tone(true);render();$('feedback').textContent='Valid route · '+cost+' units. '+(cost===5?'Optimal solution!':'A cheaper route exists.')}catch{fail('Invalid route or JSON. No Proof awarded.')}});bind('back',()=>show('victory'));return}
 if(s.m===6){show('victory');return}const m=missions[s.m],step=m.steps[s.step],r=last();view.innerHTML=head()+`<div class="eyebrow">MISSION ${s.m+1} · ${m.name} · ${s.step+1}/${m.steps.length}</div><h2>${step.title}</h2><div class="score"><div><small>Run cap (simulated)</small><b>$3.00</b></div><div><small>Reserved</small><b>${cash(r.reserved)}</b></div></div>${hero('mini')}<div class="budgetbar" role="meter" aria-label="Reserved plus settled exposure" aria-valuemin="0" aria-valuemax="300" aria-valuenow="${r.reserved+r.settled}"><span style="width:${(r.reserved+r.settled)/3}%"></span></div><div class="packet" id="packet"><small>INCOMING SIMULATED EVENT · DRAG TO A GATE</small><b>${fixtures[s.m][step.receipt].amount>0?cash(fixtures[s.m][step.receipt].amount):'Control event'}</b><small>${step.title}</small></div><p>${step.desc}</p><div class="fusionhint">Drag the incoming event to a gate, or tap a gate below.</div><div class="actions">${step.choices.map(([code,label])=>`<button data-action="${code}" class="${s.m===0&&code==='deny'?'primary':''}" ${s.credits===0&&s.step===0?'disabled':''}>${label}</button>`).join('')}</div><div id="feedback" class="feedback" role="status">${s.credits===0?(s.step>0?'Finish this mission for free.':'Out of credits? Restart free.'):'One credit per mission; incorrect actions cost one extra.'}</div>`;const stamp=epoch;view.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,stamp));wirePacket(stamp);
}
bind('sound',()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(sound));if(sound)tone(true)});bind('vault',()=>show('vault'));bind('reset',()=>{s=fresh();show('intro')});render();
</script></body></html>
