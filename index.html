<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAMOS! · Proof Arena</title><style>
:root{color-scheme:light;--cream:#fff2dc;--paper:#fffaf0;--ink:#502719;--muted:#805844;--red:#b82b19;--gold:#ffcc55;--line:#e7c99e;--green:#c7e989}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px system-ui,sans-serif;color:var(--ink)}main{max-width:470px;margin:auto;padding:16px 16px 30px}h1,h2,h3,p{margin:0}h1{font-size:clamp(34px,9vw,48px);font-weight:950;letter-spacing:-.06em;line-height:1.04}h2{font-size:27px;font-weight:900;letter-spacing:-.045em;line-height:1.12}h3{font-size:18px}p{line-height:1.45;color:var(--muted)}small,.small{font-size:12px;color:var(--muted)}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:20px}.brand{font-size:25px;font-weight:950;letter-spacing:-1.6px}.brand span{color:var(--red)}button{font:800 15px system-ui;color:var(--ink);border:2px solid var(--ink);border-radius:15px;min-height:48px;padding:10px 13px;background:linear-gradient(#fffdf5,#f7e1bc);box-shadow:inset 0 2px 0 #fff9e7,inset 0 -3px 0 #50271915,0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .1s,box-shadow .1s}button:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 0 #fff5dc,0 1px 0 var(--ink)}button:focus-visible{outline:3px solid #6636a3;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{color:white;background:linear-gradient(#e4482b,#b82b19 75%);box-shadow:inset 0 3px 0 #ffac83,inset 0 -4px 0 #801e18,0 5px 0 var(--ink);font-size:20px;min-height:57px;width:100%}.gold{background:linear-gradient(#ffe69c,#ffbd35);box-shadow:inset 0 3px 0 #fff7ce,0 4px var(--ink)}.green{background:linear-gradient(#e6f7a5,#add66a)}.panel{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:16px;box-shadow:0 4px #50271925;display:grid;gap:13px;margin:12px 0}.hero{background:radial-gradient(ellipse at 68% 55%,#fff5b5,#ffca55 70%,#f6ad39);border:2px solid var(--ink);border-radius:20px;overflow:hidden;position:relative;min-height:205px;display:grid;place-items:center}.hero svg{display:block;width:100%;height:220px}.hero .spark{animation:float 2s infinite alternate ease-in-out}@keyframes float{to{transform:translateY(-5px)}}.sub{font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.accent{color:var(--red)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.nav button{font-size:13px;padding:9px 3px}.nav button[aria-current=page]{background:linear-gradient(#ffe38e,#ffc444)}.meter{display:flex;gap:5px}.meter i{height:8px;flex:1;background:#e6d5bd;border-radius:20px}.meter .done{background:#75a848}.meter .active{background:#f9b72a}.score{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.score>div{border:1.5px solid var(--line);border-radius:13px;background:#fff2dc;padding:10px}.score b{font-size:25px;display:block;line-height:1.2}.choices{display:grid;gap:10px}.choices button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}.hint{background:#f4e3c9;border-left:4px solid #f3b83c;border-radius:9px;padding:10px;font-size:14px}.graph{border:1.5px solid var(--line);border-radius:15px;background:#fff4df;overflow:hidden}.graph svg{width:100%;display:block}.proof{border:1.5px solid #6f923d;background:#e9f4c5;padding:12px;border-radius:14px;overflow-wrap:anywhere}.rank{display:grid;grid-template-columns:25px 1fr 55px 45px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.rank b{overflow-wrap:anywhere}.rank.you{background:#fff0c1;border-radius:8px;padding-inline:5px}.rankhead{font-size:11px;color:var(--muted);font-weight:700}.avatars{display:grid;grid-template-columns:1fr 1fr;gap:10px}.avatars button{padding:8px;background:#fff5e3}.avatars button[aria-pressed=true]{background:#ffe5a0;outline:3px solid #b82b19;outline-offset:-3px}.avatars svg{width:100%;height:90px;display:block}.notice{font-size:12px;text-align:center;color:var(--muted);margin:14px 0}.hidden{display:none!important}.live{font-size:11px;font-weight:800;color:#386b27;background:#e5efcc;padding:5px 8px;border-radius:8px}.list{display:grid;gap:8px}.collection{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{border:1.5px solid var(--line);border-radius:12px;background:#fff1d2;padding:10px;min-width:0}.tile strong{display:block}.tile.locked{background:#f3e8d8;color:#8c725e}.tile .seal{font-size:27px;line-height:1.2}.tile .small{overflow-wrap:anywhere}.secondary{width:100%}.status{min-height:20px;font-size:13px}.settings{display:grid;gap:10px}footer{margin-top:20px;font-size:11px;text-align:center;color:var(--muted)}@media(max-width:350px){main{padding:10px}.panel{padding:12px}.rank{gap:4px;grid-template-columns:20px 1fr 48px 40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><div class="brand">VAMOS<span>!</span> <small>by Valta</small></div><button id="menu" class="gold" aria-label="Settings" aria-expanded="false">☰</button></header><section id="settings" class="panel hidden"><button id="sound">Sound: off</button><button id="export">Export local evidence</button><button id="reset">Reset practice</button></section><div id="nav" class="nav hidden"><button data-tab="quest">Quest</button><button data-tab="arena">Arena</button><button data-tab="proofs">My Proofs</button></div><section id="view" aria-live="polite"></section><footer>VAMOS · LOCAL PRACTICE · NO MONEY OR LIVE AI</footer></main><script>
'use strict';
const KEY='vamos24.v1', $=s=>document.querySelector(s), view=$('#view');
const fresh=()=>({started:false,hero:'fox',credits:15,mission:0,node:'S',path:['S'],cost:0,proofs:[],runs:[],sound:false,seq:0});let s=fresh();try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&p.seq>=0&&Array.isArray(p.proofs)&&Array.isArray(p.runs))s={...s,...p}}catch{}let tab='quest',timer=null,simQueue=[],simRows=[],arenaDone=false;let ac;
const heroes={fox:['#f59a37','#b74e19','Strategist'],turtle:['#6ec0a2','#287d68','Economist'],owl:['#a995e3','#66529d','Explorer'],bear:['#81b4e6','#3c6c9d','Guardian']};
function avatar(type='fox',big=false){let [c,d]=heroes[type]||heroes.fox;let ears=type==='fox'?`<path d="M83 94Q52 10 119 52L143 83M237 94Q268 10 201 52L177 83" fill="${c}" stroke="${d}" stroke-width="5"/><path d="M85 76Q72 32 111 63M235 76Q248 32 209 63" fill="#ffdfb3"/>`:type==='bear'?`<circle cx="99" cy="66" r="30" fill="${c}" stroke="${d}" stroke-width="5"/><circle cx="221" cy="66" r="30" fill="${c}" stroke="${d}" stroke-width="5"/><circle cx="99" cy="66" r="15" fill="#f9dec3"/><circle cx="221" cy="66" r="15" fill="#f9dec3"/>`:type==='owl'?`<path d="M85 90Q70 30 120 62M235 90Q250 30 200 62" stroke="${d}" stroke-width="18" stroke-linecap="round"/>`:'';let tail=type==='fox'?`<path d="M205 198Q280 221 293 149Q315 207 270 230Q235 245 207 218" fill="${c}" stroke="${d}" stroke-width="4"/><path d="M278 195Q292 172 293 149Q305 172 300 193L285 204Z" fill="#fff1d4"/>`:type==='turtle'?`<ellipse cx="207" cy="175" rx="48" ry="54" fill="#497e4e" stroke="${d}" stroke-width="4"/>`:'';return `<svg viewBox="0 0 320 260" role="img" aria-label="${heroes[type][2]} mascot"><defs><radialGradient id="g${type}"><stop stop-color="#fff5d6" stop-opacity=".8"/><stop offset=".8" stop-color="${c}"/><stop offset="1" stop-color="${d}"/></radialGradient><linearGradient id="b${type}" x2="0" y2="1"><stop stop-color="${c}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>${big?'<g class="spark" fill="#fff9da"><path d="M45 42l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/><path d="M277 62l4 9 9 4-9 4-4 9-4-9-9-4 9-4Z"/></g>':''}<ellipse cx="160" cy="240" rx="83" ry="12" fill="#502719" opacity=".15"/>${tail}<ellipse cx="160" cy="184" rx="62" ry="54" fill="url(#b${type})" stroke="${d}" stroke-width="4"/><ellipse cx="160" cy="187" rx="36" ry="37" fill="#fff0c9"/><path d="m145 182 12 13 20-23" fill="none" stroke="${d}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="121" cy="225" rx="24" ry="14" fill="${d}"/><ellipse cx="199" cy="225" rx="24" ry="14" fill="${d}"/><ellipse cx="95" cy="180" rx="19" ry="29" transform="rotate(28 95 180)" fill="${c}" stroke="${d}" stroke-width="3"/><ellipse cx="225" cy="180" rx="19" ry="29" transform="rotate(-28 225 180)" fill="${c}" stroke="${d}" stroke-width="3"/>${ears}<ellipse cx="160" cy="112" rx="85" ry="70" fill="url(#g${type})" stroke="${d}" stroke-width="4"/><path d="M83 113Q101 76 139 99L160 115L181 99Q219 76 237 113Q241 158 160 173Q79 158 83 113Z" fill="#fff2d6"/><ellipse cx="125" cy="115" rx="18" ry="23" fill="#502719"/><ellipse cx="195" cy="115" rx="18" ry="23" fill="#502719"/><ellipse cx="130" cy="108" rx="7" ry="8" fill="white"/><ellipse cx="200" cy="108" rx="7" ry="8" fill="white"/><ellipse cx="108" cy="144" rx="12" ry="6" fill="#f6a17a"/><ellipse cx="212" cy="144" rx="12" ry="6" fill="#f6a17a"/><path d="M150 140Q160 135 170 140Q160 152 150 140" fill="#502719"/><path d="M151 152Q160 163 169 152" fill="none" stroke="#502719" stroke-width="3.5" stroke-linecap="round"/><path d="M160 43V25" stroke="${d}" stroke-width="6" stroke-linecap="round"/><circle cx="160" cy="20" r="10" fill="#ffd95e" stroke="${d}" stroke-width="3"/><circle cx="157" cy="17" r="3" fill="white"/></svg>`}
const graph={S:[['A',2],['B',3]],A:[['C',3],['D',2]],B:[['D',1],['E',1]],C:[['P',3]],D:[['P',2]],E:[['P',1]]};const coords={S:[28,95],A:[102,38],B:[102,152],C:[192,32],D:[192,95],E:[192,158],P:[292,95]};
const challenges=[{name:'The hidden route',desc:'Find a route to the Proof. Every move uses practice credits.',label:'Strategy'},{name:'The retry trap',desc:'Your agent receives an upstream quota error. What is the safest next action?',label:'Guardian'},{name:'The missing evidence',desc:'Only one receipt matches the event: request 10, limit 3, denied, charged 0.',label:'Discovery'}];
const choices=[null,[['Retry immediately',false,2],['Freeze retries and check quota',true,1],['Raise the spending cap',false,2]],[['Request 10 / limit 3 / allowed / charge 10',false,2],['Request 10 / limit 3 / denied / charge 0',true,1],['Request 10 / limit 3 / denied / charge 3',false,2]]];
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function tone(win=false){if(!s.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[440,...(win?[660,880]:[])].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.08;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.1)})}catch{}}
function setTab(t){tab=t;render()}function html(t){view.innerHTML=t}function btn(label,id,cls='primary'){return `<button class="${cls}" id="${id}">${label}</button>`}function bind(id,fn){const el=$('#'+id);if(el)el.onclick=fn}function common(){ $('#nav').classList.toggle('hidden',!s.started);document.querySelectorAll('[data-tab]').forEach(x=>{if(x.dataset.tab===tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});$('#sound').textContent='Sound: '+(s.sound?'on':'off')}
function render(){common();if(!s.started){html(`<div class="panel"><div class="sub accent">Season 01 · The Origin</div><h1>What can your AI agent do?</h1><h2 class="accent">Don't tell us. Prove it.</h2><div class="hero">${avatar(s.hero,true)}</div><p>Play it yourself. Then challenge your agent.</p>${btn('VAMOS!','start')}<small>15 free practice credits. No account required.</small></div>`);bind('start',()=>{s.started=true;save();tone();render()});return}if(tab==='arena')return renderArena();if(tab==='proofs')return renderProofs();renderQuest()}
function hud(){return `<div class="row"><span class="sub">Season 01</span><strong>${s.credits} credits</strong></div><div class="meter">${challenges.map((_,i)=>`<i class="${i<s.mission?'done':i===s.mission?'active':''}"></i>`).join('')}</div>`}
function drawGraph(){return `<div class="graph"><svg viewBox="0 0 320 190" role="img" aria-label="Route graph with labelled move costs">${Object.entries(graph).flatMap(([a,edges])=>edges.map(([b,c])=>{let [x,y]=coords[a],[u,v]=coords[b];let yes=s.path.some((n,i)=>n===a&&s.path[i+1]===b);return `<path d="M${x} ${y}L${u} ${v}" stroke="${yes?'#b82b19':'#c6a579'}" stroke-width="${yes?4:2}"/><text x="${(x+u)/2}" y="${(y+v)/2-5}" font-size="11" fill="#805844" text-anchor="middle">${c}</text>`})).join('')}${Object.entries(coords).map(([k,[x,y]])=>`<circle cx="${x}" cy="${y}" r="${k==='P'?22:17}" fill="${s.node===k?'#ffbf35':s.path.includes(k)?'#c7e989':k==='E'?'#f0e2c7':'#fff9ed'}" stroke="#502719" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="${k==='P'?10:13}" text-anchor="middle" fill="#502719" font-weight="800">${k==='P'?'Proof':k}</text>`).join('')}</svg></div>`}
function receipt(m,cost,path){let data={id:'LOCAL-'+(++s.seq),mission:m+1,kind:m===0&&cost===5&&path.includes('E')?'Hidden Proof':'Proof',cost,path:[...path],scope:'simulation',verified:true};s.proofs.push(data);s.mission++;s.node='S';s.path=['S'];s.cost=0;save();tone(true);html(`<div class="panel">${hud()}<div class="hero">${avatar(s.hero,true)}</div><h2>${data.kind} found!</h2><div class="proof"><strong>${data.id}</strong><p>Mission ${data.mission} · ${data.cost} credits · locally validated</p></div><p>${data.kind==='Hidden Proof'?'You found the archive route. Nice discovery!':'Your result is recorded. Keep the evidence.'}</p>${btn(s.mission===3?'Challenge an agent':'Next mission','next')}</div>`);bind('next',()=>{if(s.mission===3)setTab('arena');else render()})}
function spend(n){if(n>s.credits){$('#message').textContent='Not enough practice credits. Replay this season for free.';return false}s.credits-=n;s.cost+=n;return true}
function renderQuest(){if(s.mission>=3){html(`<div class="panel">${hud()}<h2>All three Proofs collected.</h2><div class="hero">${avatar(s.hero,true)}</div><p>Now see how simulated agents solve the same season.</p>${btn('Challenge an agent','challenge')}${btn('Replay season for free','replay','secondary')}</div>`);bind('challenge',()=>setTab('arena'));bind('replay',replay);return}const m=s.mission,c=challenges[m];html(`<div class="panel">${hud()}<div class="sub accent">Mission ${m+1} · ${c.label}</div><h2>${c.name}</h2><p>${c.desc}</p>${m===0?drawGraph():`<div class="hero" style="min-height:145px">${avatar(s.hero,true)}</div>`}<div class="hint">Vee: ${m===0?'Look at all the paths. The most obvious route might not be the best.':m===1?'Safety comes before a successful response.':'A Proof must match what actually happened.'}</div><div class="choices" id="choices">${(m===0?graph[s.node].map(([n,c])=>[n==='E'?'Inspect archive E':n==='P'?'Reach Proof':'Move to '+n,c]):choices[m].map(([t,_,c])=>[t,c])).map(([t,c],i)=>`<button data-choice="${i}" ${c>s.credits?'disabled':''}><span>${t}</span><small>${c} cr</small></button>`).join('')}</div><div id="message" class="status" role="status">${s.credits===0?'No credits left. Free replay is available.':''}</div>${btn('Replay season for free','replay','secondary')}</div>`);bind('replay',replay);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let i=+b.dataset.choice;if(m===0){let [n,c]=graph[s.node][i];if(!spend(c))return;s.node=n;s.path.push(n);save();tone();if(n==='P')receipt(m,s.cost,s.path);else render()}else{let [t,ok,c]=choices[m][i];if(!spend(c))return;s.path.push(t);save();if(ok)receipt(m,s.cost,s.path);else{tone();render();$('#message').textContent='Not verified. Review the clue and try again.'}}})}
function replay(){if(!confirm('Restart the season with 15 credits? Your previous runs remain in local evidence.'))return;s.runs.push({kind:'human',complete:s.mission===3,proofs:s.proofs.map(x=>({...x})),spent:15-s.credits});s.mission=0;s.credits=15;s.node='S';s.path=['S'];s.cost=0;s.proofs=[];save();setTab('quest')}
function solve(kind){const paths=[];function dfs(n,path,cost){if(n==='P'){paths.push({path,cost});return}for(let [v,w] of graph[n])dfs(v,[...path,v],cost+w)}dfs('S',['S'],0);let r=kind==='Explorer'?paths.find(x=>x.path.includes('E')):kind==='Strategist'||kind==='Economist'?paths.slice().sort((a,b)=>a.cost-b.cost||a.path.length-b.path.length)[0]:paths[0];let extra=kind==='Guardian'?2:0;return {name:kind,proofs:3,cost:r.cost+2+extra,path:r.path,kind:'simulated',valid:true}}
function ranking(){let rows=[...simRows];if(s.mission===3)rows.push({name:'You',proofs:3,cost:s.proofs.reduce((a,p)=>a+p.cost,0),kind:'human'});rows.sort((a,b)=>b.proofs-a.proofs||a.cost-b.cost||a.name.localeCompare(b.name));return rows.map((r,i)=>`<div class="rank ${r.kind==='human'?'you':''}"><span>${i+1}</span><b>${r.name}</b><span>${r.cost}</span><span>${r.proofs}/3</span></div>`).join('')||'<p>No results yet. Start the simulation.</p>'}
function renderArena(){html(`<div class="panel"><div class="row"><span class="sub accent">World Arena</span><span class="live">LOCAL SIM</span></div><h2>Can your agent do better?</h2><p>Four test strategies compete under the same rules. No live AI is connected.</p><div class="avatars">${Object.entries(heroes).map(([k,v])=>`<button data-hero="${k}" aria-pressed="${s.hero===k}">${avatar(k)}${v[2]}</button>`).join('')}</div><small>Choose your companion's appearance. It does not change scoring.</small>${btn(timer?'Running…':'Run simulated tournament','run') }<div id="arenaStatus" class="status" role="status">${arenaDone?'Tournament complete.':timer?'Results arriving…':'Ready when you are.'}</div><div><div class="rank rankhead"><span>#</span><span>Agent</span><span>Cost</span><span>Proof</span></div><div id="ranks">${ranking()}</div></div><small>Rank: verified missions, then lowest credits. Equal scores are ordered by name for display only.</small></div>`);document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{s.hero=b.dataset.hero;save();renderArena()});bind('run',runArena);$('#run').disabled=!!timer}
function runArena(){if(timer)return;simRows=[];arenaDone=false;simQueue=['Guardian','Explorer','Economist','Strategist'].map(solve);renderArena();timer=setInterval(()=>{let r=simQueue.shift();if(r){simRows.push(r);if(tab==='arena'&&$('#ranks')){$('#ranks').innerHTML=ranking();$('#arenaStatus').textContent=r.name+' submitted a verified run.'}tone()}if(!simQueue.length){clearInterval(timer);timer=null;arenaDone=true;s.runs.push({kind:'tournament',results:simRows.map(x=>({...x}))});save();if(tab==='arena')renderArena()}},850);$('#run').disabled=true;$('#run').textContent='Running…'}
function renderProofs(){html(`<div class="panel"><div class="sub accent">Evidence vault</div><h2>My Proof Collection</h2><p>Each receipt records a successful local challenge. No blockchain or real Valta audit log.</p><div class="collection">${challenges.map((c,i)=>{let p=s.proofs.find(x=>x.mission===i+1);return `<div class="tile ${p?'':'locked'}"><div class="seal">${p?'◆':'◇'}</div><strong>${c.label}</strong><small>${p?p.kind+' · '+p.cost+' cr':'Not discovered'}</small>${p?`<div class="small">${p.id}</div>`:''}</div>`}).join('')}</div><div class="list">${s.proofs.map(p=>`<div class="proof"><b>${p.id} · ${p.kind}</b><p>${p.path.join(' → ')}</p><small>Scope: simulation · charged real money: 0</small></div>`).join('')}</div>${btn('Export local evidence','export2','secondary')}</div>`);bind('export2',download)}
function download(){let b=new Blob([JSON.stringify({version:'VALTA-024',scope:'local simulation',realMoney:0,state:s},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='VAMOS-local-proof.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#menu').onclick=()=>{let e=$('#settings');e.classList.toggle('hidden');$('#menu').setAttribute('aria-expanded',String(!e.classList.contains('hidden')))};$('#sound').onclick=()=>{s.sound=!s.sound;save();common();tone()};$('#export').onclick=download;$('#reset').onclick=()=>{if(!confirm('Delete all local practice progress?'))return;clearInterval(timer);timer=null;simRows=[];arenaDone=false;s=fresh();save();tab='quest';$('#settings').classList.add('hidden');$('#menu').setAttribute('aria-expanded','false');render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));render();
</script></body></html>
